apiVersion: v1
kind: Service
metadata:
  name: scaletestapp
  labels:
    app: scaletestapp
spec:
  # NodePort, чтобы Locust с хоста подавал нагрузку через балансировку kube-proxy
  # на все реплики (kubectl port-forward привязывается к одному поду).
  type: NodePort
  selector:
    app: scaletestapp
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
