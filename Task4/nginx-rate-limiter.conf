# NGINX API Gateway: раздельный Rate Limiter для веб- и мобильного приложения.
#
# Было: одна зона "one" на 100 r/s и burst=200 для всех клиентов сразу.
# Стало:
#   - веб-приложение   (заголовок Client-Type: web)    — до 50 r/s с одного IP;
#   - мобильное прил.  (заголовок Client-Type: mobile) — до 30 r/s с одного IP;
#   - прочие клиенты (без Client-Type / неизвестный тип) — по самому строгому лимиту 30 r/s,
#     чтобы обойти ограничение, просто не передав заголовок, было нельзя.
#
# Как запустить и протестировать — см. README.md.

worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    log_format ratelimit '$remote_addr [$time_local] client_type=$http_client_type '
                         '"$request" $status limit_req=$limit_req_status';
    access_log /dev/stdout ratelimit;

    # Ключ зоны пустой, если запрос относится к другому каналу:
    # запросы с пустым ключом в зоне не учитываются, поэтому каждый канал
    # ограничивается только своей зоной.
    map $http_client_type $web_limit_key {
        default "";
        web     $binary_remote_addr;
    }

    map $http_client_type $mobile_limit_key {
        default "";
        mobile  $binary_remote_addr;
    }

    map $http_client_type $default_limit_key {
        default $binary_remote_addr;
        web     "";
        mobile  "";
    }

    limit_req_zone $web_limit_key     zone=web_limit:10m     rate=50r/s;
    limit_req_zone $mobile_limit_key  zone=mobile_limit:10m  rate=30r/s;
    limit_req_zone $default_limit_key zone=default_limit:10m rate=30r/s;

    # 429 Too Many Requests вместо 503 по умолчанию: клиент понимает, что его ограничили
    limit_req_status 429;
    limit_req_log_level warn;

    upstream backend {
        # 127.0.0.1 вместо localhost: localhost резолвится ещё и в ::1, а тестовый сервер слушает только IPv4
        server 127.0.0.1:8081;
    }

    server {
        listen 8080;

        # Веб и мобилки обращаются на этот ресурс, тип клиента — в заголовке Client-Type
        location /api/ {
            # burst = секундный объём лимита; nodelay — отдаём сразу, без искусственной задержки,
            # всё сверх лимита + burst сразу получает 429 (важно для требования к отклику < 1 c)
            limit_req zone=web_limit     burst=50 nodelay;
            limit_req zone=mobile_limit  burst=30 nodelay;
            limit_req zone=default_limit burst=30 nodelay;

            proxy_pass http://backend;
        }
    }

    # Тестовый сервер для имитации бэкенда приложения
    server {
        listen 8081;

        location /api/ {
            add_header Content-Type application/json;

            # Эмулируем разное поведение в зависимости от заголовка
            if ($http_client_type = "web") {
                return 200 '{"status": "success", "service": "web_backend", "data": "Web application response"}';
            }
            if ($http_client_type = "mobile") {
                return 200 '{"status": "success", "service": "mobile_backend", "data": "Mobile application response"}';
            }

            # Дефолтный ответ
            return 200 '{"status": "success", "service": "default_backend", "data": "Default response"}';
        }
    }
}
