# NGINX-прокси к внешним сервисам: Circuit Breaker для логистического провайдера.
#
# Требования и как они реализованы:
#   1. Таймаут ответа 3 c          -> proxy_connect/send/read_timeout 3s (было 30s).
#   2. 5 ошибок подряд -> пауза 30 c -> max_fails=5 fail_timeout=30s + proxy_next_upstream:
#      ошибки соединения, таймауты и 5xx считаются неуспешными попытками; после 5 неуспешных
#      попыток (в пределах fail_timeout) сервер исключается из балансировки на 30 c — цепь
#      «разомкнута»: внешний сервис не вызывается, клиент сразу получает fallback-ответ.
#   3. Восстановление              -> через 30 c NGINX пропускает к сервису пробный запрос
#      (half-open): если он успешен, счётчик ошибок сбрасывается и трафик идёт как обычно;
#      если нет — сервер снова исключается на 30 c.
#   Fallback: любой итоговый 5xx (ошибка, таймаут, разомкнутая цепь) перехватывается
#   error_page и превращается в единый контролируемый ответ 503 + Retry-After.
#
# Важно:
#   - backup-сервер обязателен: если в upstream один сервер, NGINX игнорирует max_fails/fail_timeout
#     и никогда не считает его недоступным (см. документацию ngx_http_upstream_module);
#   - zone: состояние «цепи» хранится в разделяемой памяти и общее для всех worker-процессов,
#     иначе каждый воркер считал бы ошибки отдельно.
#
# Как запустить и протестировать — см. README.md.

# njs нужен только тестовому серверу логистики, чтобы /slow отвечал действительно через 5 c
load_module modules/ngx_http_js_module.so;

worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    log_format circuit '$remote_addr [$time_local] "$request" $status '
                       'upstream=$upstream_addr upstream_status=$upstream_status '
                       'upstream_time=$upstream_response_time request_time=$request_time';
    access_log /dev/stdout circuit;

    js_path "/etc/nginx/njs/";
    js_import logistics_mock from logistics_mock.js;

    upstream logistics_backend {
        zone logistics_backend 64k;

        # Используем тестовый сервер (127.0.0.1 вместо localhost: localhost резолвится и в ::1,
        # и тогда в upstream оказалось бы два адреса со своими счётчиками ошибок)
        server 127.0.0.1:9090 max_fails=5 fail_timeout=30s;

        # Резервная заглушка: получает запросы, только пока основной сервер исключён («цепь разомкнута»),
        # и мгновенно отвечает ошибкой, которая превращается в fallback. max_fails=0 — сама не исключается.
        server 127.0.0.1:9091 backup max_fails=0;
    }

    server {
        listen 8080;

        location /logistics/ {
            # /logistics/<path> -> <path> на стороне логистического сервиса
            proxy_pass http://logistics_backend/;

            proxy_connect_timeout 3s;
            proxy_send_timeout 3s;
            proxy_read_timeout 3s;

            # Что считается неуспешной попыткой (учитывается в max_fails): недоступность, таймаут, 5xx
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            # Итоговая ошибка -> контролируемый fallback-ответ
            proxy_intercept_errors on;
            error_page 500 502 503 504 = @logistics_fallback;

            # Для наблюдаемости: какие серверы обрабатывали запрос и с каким статусом
            add_header X-Upstream-Addr $upstream_addr always;
            add_header X-Upstream-Status $upstream_status always;
        }

        location @logistics_fallback {
            default_type application/json;
            add_header X-Fallback "logistics" always;
            add_header X-Upstream-Addr $upstream_addr always;
            add_header X-Upstream-Status $upstream_status always;
            add_header Retry-After 30 always;
            return 503 '{"status": "fallback", "service": "logistics", "message": "Logistics service is temporarily unavailable, please retry later"}';
        }
    }

    # Резервная заглушка upstream (см. logistics_backend)
    server {
        listen 127.0.0.1:9091;
        return 503;
    }

    # Тестовый сервер для имитации логистического сервиса
    server {
        listen 9090;

        location / {
            add_header Content-Type application/json;

            # Нормальный быстрый ответ
            if ($arg_type = "fast") {
                return 200 '{"status": "success", "service": "logistics", "response_time": "fast", "tracking_id": "TRK_FAST_123"}';
            }

            # Медленный ответ (превышает таймаут)
            if ($arg_type = "slow") {
                return 200 '{"status": "slow", "service": "logistics", "response_time": "5000ms", "message": "This response is delayed"}';
            }

            # Ответ с ошибкой
            if ($arg_type = "error") {
                return 500 '{"status": "error", "service": "logistics", "error_code": "INTERNAL_ERROR", "message": "Service temporarily unavailable"}';
            }

            # Случайное поведение для тестирования - УПРОЩЕННАЯ ВЕРСИЯ
            if ($arg_type = "random") {
                # Альтернативный подход без вложенных if
                return 200 '{"status": "success", "service": "logistics", "type": "random", "note": "Random behavior simulation"}';
            }

            # Стандартный успешный ответ
            return 200 '{"status": "success", "service": "logistics", "data": {"tracking_id": "TRK123456", "estimated_delivery": "2024-01-15", "status": "in_transit"}}';
        }

        # Специальные endpoints для тестирования Circuit Breaker
        location /fast {
            add_header Content-Type application/json;
            return 200 '{"status": "success", "endpoint": "fast", "message": "Quick response"}';
        }

        location /slow {
            # Этот endpoint всегда медленный (5 секунд): задержка через njs (setTimeout),
            # потому что «return» отвечает мгновенно и таймаут проверить не позволяет
            js_content logistics_mock.slow;
        }

        location /error {
            add_header Content-Type application/json;
            return 503 '{"status": "error", "endpoint": "error", "error": "service_unavailable", "message": "Logistics service is experiencing issues"}';
        }

        location /unavailable {
            add_header Content-Type application/json;
            return 500 '{"status": "error", "endpoint": "unavailable", "error": "internal_server_error"}';
        }

        # Отдельный endpoint для случайного поведения
        location /random-behavior {
            add_header Content-Type application/json;
            # Простая логика случайности на основе последней цифры IP
            set $last_digit 0;
            if ($remote_addr ~* ".*\.(\d)$") {
                set $last_digit $1;
            }

            # Проверяем четность последней цифры
            if ($last_digit ~* "[13579]") {
                return 200 '{"status": "success", "service": "logistics", "type": "random_success", "ip_last_digit": "$last_digit"}';
            }
            if ($last_digit ~* "[24680]") {
                return 503 '{"status": "error", "service": "logistics", "type": "random_error", "ip_last_digit": "$last_digit"}';
            }

            return 200 '{"status": "success", "service": "logistics", "type": "default"}';
        }
    }
}
